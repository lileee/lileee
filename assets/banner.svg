<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Damien Li — Stay curious. Build with intention.</title>
  <desc id="desc">A warm ivory landscape with jade mountains, a vermilion sun, and an open orbit. Technology, design, and enduring ideas.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#326B63"/><stop offset="1" stop-color="#183F3C"/></linearGradient>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#F4F1E9"/>
    <path d="M800 0H1200V360H730Z" fill="#E9EDE4"/>
    <g fill="none" stroke="#9AAEA2" stroke-width="1" opacity=".45">
      <circle cx="1002" cy="158" r="133"/>
      <ellipse cx="1002" cy="158" rx="189" ry="74" transform="rotate(-32 1002 158)"/>
      <path d="M805 158H1198M1002 0V305" stroke-dasharray="3 9"/>
    </g>
    <circle cx="1062" cy="86" r="30" fill="#C56B4E"/>
    <circle cx="888" cy="64" r="5" fill="#326B63"/>
