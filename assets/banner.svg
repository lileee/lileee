    <path d="M793 360L925 246L990 299L1122 211L1250 360Z" fill="url(#jade)"/>
    <path d="M914 360C972 311 1006 348 1070 294C1122 252 1178 271 1232 233" fill="none" stroke="#F4F1E9" stroke-width="2" opacity=".65"/>
    <rect x="58" y="53" width="29" height="3" rx="1.5" fill="#C56B4E"/>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
      <text x="103" y="60" font-size="13" letter-spacing="3" fill="#506B62">AN OPEN NOTEBOOK / 无限探索</text>
      <text x="56" y="147" font-size="65" font-weight="650" letter-spacing="-2.5" fill="#203F39">Damien Li<tspan fill="#C56B4E">.</tspan></text>
      <text x="59" y="195" font-size="25" fill="#326B63">Stay curious. Build with intention.</text>
      <text x="59" y="233" font-size="18" letter-spacing="2" fill="#66756C">保持好奇 · 知行合一 · 向远而行</text>
      <path d="M59 273H685" stroke="#CDD4C8"/>
      <text x="59" y="310" font-size="13" letter-spacing="2.2" fill="#506B62">TECHNOLOGY × DESIGN × ENDURING IDEAS</text>
      <text x="1138" y="329" text-anchor="end" font-size="12" letter-spacing="2" fill="#DDE7DE">山海之间</text>
    </g>
  </g>
